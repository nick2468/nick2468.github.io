# Builds the site and publishes it to GitHub Pages on every push to main.
# The repository's Pages source must be set to "GitHub Actions" (Settings > Pages).
name: Publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. A newer push waits rather than cancelling one already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The runner's own Python 3 is enough: the build uses the standard library only.
      - name: Test the build script
        run: python3 -m unittest discover -s site
      - name: Build the site
        run: python3 site/build.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
